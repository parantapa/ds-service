[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-service-client"
dynamic = ["version"]
authors = [
  { name="Parantapa Bhattacharya", email="pb@parantapa.net" },
]
description = "Python client for DS service."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "grpcio>=1.60",
    "protobuf>=6.31",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/parantapa/ds-service"

# Package only the ds_service_client module.
# setuptools_scm otherwise sweeps every tracked file
# under the package into the wheel,
# so drop the source .proto that lives beside the generated stubs.
[tool.setuptools.packages.find]
where = ["python"]
include = ["ds_service_client*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.proto"]

[tool.setuptools_scm]
fallback_version = "1.0.0-dev"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
