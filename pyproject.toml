[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-service-client"
# Set by scripts/update-version.sh, along with the other version strings.
version = "2.2.0"
authors = [
  { name="Parantapa Bhattacharya", email="pb@parantapa.net" },
]
description = "Python client for DS service."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "grpcio>=1.60",
    "protobuf>=6.31",
    "ifaddr>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/parantapa/ds-service"

# Package only the ds_service_client module,
# and keep the source .proto that lives beside the generated stubs
# out of the wheel.
[tool.setuptools.packages.find]
where = ["python"]
include = ["ds_service_client*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]

# Check the hand-written code only.
# The generated stubs are excluded because they are not ours to fix
# -- protoc emits calls into `grpc.experimental`,
# which grpc's own type stubs do not declare --
# and the build tree is excluded
# because it holds stale copies of the same files,
# which would otherwise be reported twice.
[tool.pyright]
include = ["python", "tests"]
exclude = [
    "**/__pycache__",
    "build",
    "dist",
    "python/ds_service_client/ds_service_pb2.py",
    "python/ds_service_client/ds_service_pb2.pyi",
    "python/ds_service_client/ds_service_pb2_grpc.py",
]
extraPaths = ["python"]
pythonVersion = "3.12"
