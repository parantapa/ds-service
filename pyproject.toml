[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-service-client"
# Set by scripts/update-version.sh, along with the other version strings.
version = "2.0.0"
authors = [
  { name="Parantapa Bhattacharya", email="pb@parantapa.net" },
]
description = "Python client for DS service."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "grpcio>=1.60",
    "protobuf>=6.31",
    "ifaddr>=0.2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/parantapa/ds-service"

# Package only the ds_service_client module,
# and keep the source .proto that lives beside the generated stubs
# out of the wheel.
[tool.setuptools.packages.find]
where = ["python"]
include = ["ds_service_client*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.proto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
