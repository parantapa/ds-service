edition = "2023";

service DsService {
    rpc MapSet(MapSetRequest) returns (Empty) {}
    rpc MapGet(MapGetRequest) returns (MapGetResponse) {}
    rpc MapSearchKey(SearchKeyRequest) returns (SearchKeyResponse) {}

    rpc TaskAdd(TaskAddRequest) returns (Empty) {}
    rpc TaskGetStatus(TaskGetStatusRequest) returns (TaskGetStatusResponse) {}
    rpc TaskGetOutput(TaskGetOutputRequest) returns (TaskGetOutputResponse) {}
    rpc TaskGetCountByState(Empty) returns (TaskGetCountByStateResponse) {}
    rpc TaskCancel(TaskCancelRequest) returns (TaskCancelResponse) {}
    rpc TaskGetPriority(TaskGetPriorityRequest) returns (TaskGetPriorityResponse) {}
    rpc TaskSetPriority(TaskSetPriorityRequest) returns (Empty) {}
    rpc TaskGetWorkerId(TaskGetWorkerIdRequest) returns (TaskGetWorkerIdResponse) {}

    rpc TaskGet(TaskGetRequest) returns (TaskGetResponse) {}
    rpc TaskDone(TaskDoneRequest) returns (Empty) {}

    rpc JournalSize(JournalSizeRequest) returns (JournalSizeResponse) {}
    rpc JournalRead(JournalReadRequest) returns (JournalReadResponse) {}
    rpc JournalAppend(JournalAppendRequest) returns (Empty) {}
    rpc JournalSearchKey(SearchKeyRequest) returns (SearchKeyResponse) {}

    rpc TimeSeriesAppend(TimeSeriesAppendRequest) returns (Empty) {}
    rpc TimeSeriesGet(TimeSeriesGetRequest) returns (TimeSeriesGetResponse) {}
    rpc TimeSeriesSearchKey(SearchKeyRequest) returns (SearchKeyResponse) {}

    rpc MutexTryAcquire(MutexTryAcquireRequest) returns (MutexTryAcquireResponse) {}
    rpc MutexRelease(MutexReleaseRequest) returns (Empty) {}
    rpc MutexGetWorkerId(MutexGetWorkerIdRequest) returns (MutexGetWorkerIdResponse) {}
    rpc MutexSearchKey(SearchKeyRequest) returns (SearchKeyResponse) {}

    rpc CounterGetNextValue(CounterGetNextValueRequest) returns (CounterGetNextValueResponse) {}
    rpc CounterGetCurrentValue(CounterGetCurrentValueRequest) returns (CounterGetCurrentValueResponse) {}
    rpc CounterSearchKey(SearchKeyRequest) returns (SearchKeyResponse) {}
};

message Empty {}

message MapSetRequest {
    string key = 1;
    bytes value = 2;
}

message MapGetRequest {
    string key = 1;
}

message MapGetResponse {
    bytes value = 1;
}

message SearchKeyRequest {
    string pattern = 1;
}

message SearchKeyResponse {
    repeated string key = 1;
}

message TaskAddRequest {
    string task_id = 1;
    repeated string queue = 2;
    double priority = 3;
    bytes function = 4;
    bytes input = 5;
}

// Undefined is reported by TaskGetStatus for a task_id that does not exist.
enum TaskState {
    Ready = 0;
    Running = 1;
    Complete = 2;
    Canceled = 3;
    Undefined = 4;
}

// TaskGetStatus reports the state of every requested task_id,
// in the same order as the request.
// A task_id that does not exist reports Undefined.
message TaskGetStatusRequest {
    repeated string task_id = 1;
}

message TaskGetStatusResponse {
    repeated TaskState state = 1;
}

message TaskGetOutputRequest {
    string task_id = 1;
}

message TaskGetOutputResponse {
    bytes output = 1;
}

// Counts of all tasks in the system by state.
// Every task is in exactly one of these states, so the four
// counts sum to the total number of tasks the server knows about.
message TaskGetCountByStateResponse {
    uint64 ready = 1;
    uint64 running = 2;
    uint64 complete = 3;
    uint64 canceled = 4;
}

// Cancelling a Ready task stops it being dispatched from any queue
// it was waiting on;
// cancelling a Running task takes it away from the worker holding it.
message TaskCancelRequest {
    string task_id = 1;
}

// success is true if the task was Ready or Running
// and this call moved it to Canceled,
// false if it was already Complete or Canceled
// and so was left as it was.
message TaskCancelResponse {
    bool success = 1;
}

message TaskGetPriorityRequest {
    string task_id = 1;
}

message TaskGetPriorityResponse {
    double priority = 1;
}

// Re-prioritizing a Ready task moves it within every queue it waits on,
// and it goes behind equal priority the tasks already waiting.
message TaskSetPriorityRequest {
    string task_id = 1;
    double priority = 2;
}

// Reports the worker that claimed a Running task through TaskGet.
// NOT_FOUND for a task_id that does not exist,
// and FAILED_PRECONDITION for a task that is not Running.
message TaskGetWorkerIdRequest {
    string task_id = 1;
}

message TaskGetWorkerIdResponse {
    string worker_id = 1;
}

message TaskGetRequest {
    string worker_id = 1;
    repeated string queue = 2;
}

message TaskGetResponse {
    string task_id = 1;
    bytes function = 2;
    bytes input = 3;
}

// worker_id must be the one that claimed the task through TaskGet.
// TaskDone from any other worker is refused.
// TaskDone on a Canceled task is accepted but does nothing.
// The task stays Canceled and the output is discarded.
message TaskDoneRequest {
    string task_id = 1;
    bytes output = 2;
    string worker_id = 3;
}

message JournalSizeRequest {
    string key = 1;
}

message JournalSizeResponse {
    uint64 size = 1;
}

message JournalReadRequest {
    string key = 1;
    uint64 start = 2;
    uint64 end = 3;
}

message JournalReadResponse {
    repeated bytes entry = 1;
}

message JournalAppendRequest {
    string key = 1;
    bytes value = 2;
}

// datetime is ISO 8601 UTC datetime string
// (e.g. "2024-01-02T03:04:05Z" or "...+00:00").
// step is optional; when omitted it defaults to 0.
message TimeSeriesAppendRequest {
    string key = 1;
    double value = 2;
    string datetime = 3;
    int64 step = 4;
}

message TimeSeriesDataPoint {
    double value = 1;
    string datetime = 2;
    int64 step = 3;
}

// All four filter fields are optional.
// start_time / start_step are inclusive lower bounds.
// end_time / end_step are exclusive upper bounds.
// An unset field imposes no bound.
// Time bounds are ISO 8601 UTC datetime strings.
message TimeSeriesGetRequest {
    string key = 1;
    string start_time = 2;
    string end_time = 3;
    int64 start_step = 4;
    int64 end_step = 5;
}

message TimeSeriesGetResponse {
    repeated TimeSeriesDataPoint point = 1;
}

// Acquiring a mutex that does not exist creates it first.
// worker_id is recorded as the holder of a mutex this call acquires,
// and it is what MutexRelease must present to release it again.
message MutexTryAcquireRequest {
    string key = 1;
    string worker_id = 2;
}

// acquired is true if the mutex was acquired by this call,
// false if it was already held --
// by any worker, this one included, since the lock is not reentrant.
message MutexTryAcquireResponse {
    bool acquired = 1;
}

// worker_id must be the one that acquired the mutex.
// Releasing clears the recorded holder, leaving the mutex free.
// Every other case is refused with FAILED_PRECONDITION:
// a mutex held by another worker, one that is already free,
// and one that does not exist.
message MutexReleaseRequest {
    string key = 1;
    string worker_id = 2;
}

// Reports the worker holding the mutex.
// NOT_FOUND for a key no MutexTryAcquire has ever named,
// and FAILED_PRECONDITION for a key that exists but is free.
message MutexGetWorkerIdRequest {
    string key = 1;
}

message MutexGetWorkerIdResponse {
    string worker_id = 1;
}

// The first call for a given key creates the counter and returns 1;
// each subsequent call returns the previous value plus one.
message CounterGetNextValueRequest {
    string key = 1;
}

message CounterGetNextValueResponse {
    uint64 value = 1;
}

// Read-only: returns the counter's current value without changing it,
// or 0 if the counter does not exist (it is not created).
message CounterGetCurrentValueRequest {
    string key = 1;
}

message CounterGetCurrentValueResponse {
    uint64 value = 1;
}
